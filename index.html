<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adib Gadget Gallery-2</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 15px;
      color: #222;
    }
    header {
      text-align: center;
      background: #111;
      color: #fff;
      padding: 20px 15px;
      margin: 0 auto 20px;
      max-width: 900px;
      border-radius: 6px;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    header p {
      margin: 0;
      font-size: 14px;
      color: #ddd;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 900px;
      margin: auto;
    }
    @media (min-width: 700px) {
      body {
        padding: 20px;
      }
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
    }
    .box {
      background: #fff;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .box img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
    }
    @media (min-width: 700px) {
      .box img {
        height: 180px;
      }
    }
    .box h2 {
      font-size: 16px;
      margin: 10px 0 6px;
      line-height: 1.3;
    }
    .price {
      font-size: 18px;
      font-weight: bold;
      color: green;
      margin: 6px 0 8px;
    }
    .link-btn {
      display: inline-block;
      background: #111;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      margin-top: 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .link-btn:hover {
      background: #333;
    }
  </style>
</head>

  <!-- ওয়েবসাইটের নাম ও সাবটাইটেল / Website Name & Subtitle -->

      <img src="https://placehold.co/300x300?text=Product+1" alt="Product 1" />

      <!-- প্রোডাক্টের নাম নিচে লিখুন (Product Title) -->
      <h2>Gadget Name 1</h2>

      <!-- দাম নিচে লিখুন (Price in BDT) -->
      <p class="price">৳ 0,000</p>
