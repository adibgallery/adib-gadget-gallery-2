  <title>Adib Gadget Gallery-2</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 15px;
      color: #222;
    }
    header {
      text-align: center;
      background: #111;
      color: #fff;
      padding: 20px 15px;
      margin: 0 auto 15px;
      max-width: 900px;
      border-radius: 6px;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    header p {
      margin: 0;
      font-size: 14px;
      color: #ddd;
    }
    .search-wrap {
      max-width: 900px;
      margin: 0 auto 15px;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      background: #fff;
    }
    .search-wrap input:focus {
      border-color: #111;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 900px;
      margin: auto;
    }
    @media (min-width: 700px) {
      body {
        padding: 20px;
      }
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
    }
    .box {
      background: #fff;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .box img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
    }
    @media (min-width: 700px) {
      .box img {
        height: 180px;
      }
    }
    .box h2 {
      font-size: 16px;
      margin: 10px 0 6px;
      line-height: 1.3;
    }
    .price {
      font-size: 18px;
      font-weight: bold;
      color: green;
      margin: 6px 0 8px;
    }
    .link-btn {
      display: inline-block;
      background: #111;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      margin-top: 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .link-btn:hover {
      background: #333;
    }
    .no-result {
      text-align: center;
      color: #666;
      margin: 30px auto;
      font-size: 16px;
      display: none;
    }
  </style>
</head>

  <!-- ওয়েবসাইটের নাম ও সাবটাইটেল / Website Name & Subtitle -->

    ];

    const grid = document.getElementById("productGrid");
    const noResult = document.getElementById("noResult");
    const searchInput = document.getElementById("searchInput");

    function renderProducts(list) {
      grid.innerHTML = "";
      if (list.length === 0) {
        noResult.style.display = "block";
        return;
      }
      noResult.style.display = "none";

      list.forEach(function (item) {
        const box = document.createElement("div");
        box.className = "box";

        const topWrap = document.createElement("div");

        const img = document.createElement("img");
        img.src = item.img;
        img.alt = item.name;
        img.loading = "lazy";

        const title = document.createElement("h2");
        title.textContent = item.name;

        topWrap.appendChild(img);
        topWrap.appendChild(title);

        const bottomWrap = document.createElement("div");

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = item.price;

        const btn = document.createElement("a");
        btn.className = "link-btn";
        btn.href = item.link || "#";
        btn.textContent = "Order / Link";
        if (item.link && item.link !== "#") {
          btn.target = "_blank";
          btn.rel = "noopener noreferrer";
        }

        bottomWrap.appendChild(price);
        bottomWrap.appendChild(btn);

        box.appendChild(topWrap);
        box.appendChild(bottomWrap);
        grid.appendChild(box);
      });
    }

    searchInput.addEventListener("input", function () {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = products.filter(function (item) {
        return item.name.toLowerCase().includes(query);
      });
      renderProducts(filtered);
    });
