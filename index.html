<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adib Gadget Gallery-2</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 15px;
      color: #222;
    }
    /* হেডার ব্যানার লোগো */
    .banner-header {
      max-width: 900px;
      margin: 0 auto 15px;
      border-radius: 8px;
      overflow: hidden;
      background: #060b14;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }
    .banner-header img {
      width: 100%;
      height: auto;
      display: block;
    }
    .fallback-header {
      text-align: center;
      background: #111;
      color: #fff;
      padding: 20px 15px;
    }
    .fallback-header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    .fallback-header p {
      margin: 0;
      font-size: 14px;
      color: #ddd;
    }
    /* সার্চ বক্স */
    .search-wrap {
      max-width: 900px;
      margin: 0 auto 15px;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      background: #fff;
    }
    .search-wrap input:focus {
      border-color: #0088ff;
    }
    /* প্রোডাক্ট গ্রিড */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 900px;
      margin: auto;
    }
    @media (min-width: 700px) {
      body {
        padding: 20px;
      }
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
    }
    .box {
      background: #fff;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .img-wrap {
      position: relative;
      cursor: pointer;
    }
    .box img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
      display: block;
    }
    @media (min-width: 700px) {
      .box img {
        height: 180px;
      }
    }
    .multi-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 12px;
      pointer-events: none;
    }
    .box h2 {
      font-size: 16px;
      margin: 10px 0 6px;
      line-height: 1.3;
    }
    .price {
      font-size: 18px;
      font-weight: bold;
      color: green;
      margin: 6px 0 8px;
    }
    .link-btn {
      display: inline-block;
      background: #111;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      margin-top: 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .link-btn:hover {
      background: #333;
    }
    .no-result {
      text-align: center;
      color: #666;
      margin: 30px auto;
      font-size: 16px;
      display: none;
    }

    /* ফুল-স্ক্রিন ফটো ভিউয়ার (Lightbox) */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
    }
    .lightbox.open {
      display: flex;
    }
    .lb-top {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .lb-info {
      text-align: left;
      overflow: hidden;
    }
    .lb-title {
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-price {
      font-size: 14px;
      color: #4ade80;
      font-weight: bold;
      margin-top: 2px;
    }
    .lb-close {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .lb-img-area {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px 0;
    }
    .lb-img-area img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 6px;
      user-select: none;
    }
    .lb-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 6px 0 10px;
    }
    .lb-btn {
      background: #0088ff;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .lb-btn:active {
      background: #0066cc;
    }
    .lb-counter {
      color: #ddd;
      font-size: 13px;
      min-width: 45px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- হেডার লোগো ব্যানার (GitHub-এ banner.jpg নামে আপলোড করুন) -->
  <header class="banner-header">
    <img
      src="banner.jpg"
      alt="Adib Gadget Gallery-2"
      onerror="this.style.display='none'; document.getElementById('fallbackHeader').style.display='block';"
    />
    <div id="fallbackHeader" class="fallback-header" style="display:none;">
      <h1>Adib Gadget Gallery-2</h1>
      <p>Product Price List</p>
    </div>
  </header>

  <!-- কাস্টমারের সার্চ বক্স / Customer Search Box -->
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search product... / প্রোডাক্টের নাম লিখে খুঁজুন..." />
  </div>

  <!-- প্রোডাক্ট কার্ডগুলো এখানে অটোমেটিক দেখাবে -->
  <div class="grid" id="productGrid"></div>
  <p class="no-result" id="noResult">কোনো প্রোডাক্ট পাওয়া যায়নি / No product found</p>

  <!-- ফুল-স্ক্রিন ছবি দেখার বক্স (Lightbox) -->
  <div class="lightbox" id="lightbox">
    <div class="lb-top">
      <div class="lb-info">
        <div class="lb-title" id="lbTitle"></div>
        <div class="lb-price" id="lbPrice"></div>
      </div>
      <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    </div>

    <div class="lb-img-area" id="lbImgArea">
      <img id="lbImg" src="" alt="Product Preview" />
    </div>

    <div class="lb-bottom" id="lbControls">
      <button class="lb-btn" id="prevBtn">◀ Prev</button>
      <span class="lb-counter" id="lbCounter">1 / 1</span>
      <button class="lb-btn" id="nextBtn">Next ▶</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // নিচের তালিকায় ১ থেকে ৫০ পর্যন্ত প্রোডাক্টের তথ্য পরিবর্তন করুন:
    // - name: প্রোডাক্টের নাম
    // - price: প্রোডাক্টের দাম (৳ সহ)
    // - img: ১টি ছবির জন্য -> "watch.jpg"
    //        ২-৩টি ছবির জন্য -> ["watch1.jpg", "watch2.jpg", "watch3.jpg"]
    // - link: অর্ডার লিংক (যেমন "https://wa.me/8801XXXXXXXXX")
    // সতর্কতা: শুধু "" (কোটেশন)-এর ভেতরের লেখা বদলাবেন, কমা বা ব্র্যাকেট মুছবেন না!
    // =========================================================================
    const products = [
      /* 01 */ { name: "Ven-Dens wireless headphone VD HP019", price: "৳ 950", img: "Ven-Dens wireless headphone.jpg", link: "https://wa.me/8801868963749" },
      /* 02 */ { name: "Gadget Name 2", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+2", link: "#" },
      /* 03 */ { name: "Gadget Name 3", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+3", link: "#" },
      /* 04 */ { name: "Gadget Name 4", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+4", link: "#" },
      /* 05 */ { name: "Gadget Name 5", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+5", link: "#" },
      /* 06 */ { name: "Gadget Name 6", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+6", link: "#" },
      /* 07 */ { name: "Gadget Name 7", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+7", link: "#" },
      /* 08 */ { name: "Gadget Name 8", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+8", link: "#" },
      /* 09 */ { name: "Gadget Name 9", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+9", link: "#" },
      /* 10 */ { name: "Gadget Name 10", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+10", link: "#" },
      /* 11 */ { name: "Gadget Name 11", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+11", link: "#" },
      /* 12 */ { name: "Gadget Name 12", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+12", link: "#" },
      /* 13 */ { name: "Gadget Name 13", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+13", link: "#" },
      /* 14 */ { name: "Gadget Name 14", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+14", link: "#" },
      /* 15 */ { name: "Gadget Name 15", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+15", link: "#" },
      /* 16 */ { name: "Gadget Name 16", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+16", link: "#" },
      /* 17 */ { name: "Gadget Name 17", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+17", link: "#" },
      /* 18 */ { name: "Gadget Name 18", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+18", link: "#" },
      /* 19 */ { name: "Gadget Name 19", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+19", link: "#" },
      /* 20 */ { name: "Gadget Name 20", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+20", link: "#" },
      /* 21 */ { name: "Gadget Name 21", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+21", link: "#" },
      /* 22 */ { name: "Gadget Name 22", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+22", link: "#" },
      /* 23 */ { name: "Gadget Name 23", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+23", link: "#" },
      /* 24 */ { name: "Gadget Name 24", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+24", link: "#" },
      /* 25 */ { name: "Gadget Name 25", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+25", link: "#" },
      /* 26 */ { name: "Gadget Name 26", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+26", link: "#" },
      /* 27 */ { name: "Gadget Name 27", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+27", link: "#" },
      /* 28 */ { name: "Gadget Name 28", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+28", link: "#" },
      /* 29 */ { name: "Gadget Name 29", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+29", link: "#" },
      /* 30 */ { name: "Gadget Name 30", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+30", link: "#" },
      /* 31 */ { name: "Gadget Name 31", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+31", link: "#" },
      /* 32 */ { name: "Gadget Name 32", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+32", link: "#" },
      /* 33 */ { name: "Gadget Name 33", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+33", link: "#" },
      /* 34 */ { name: "Gadget Name 34", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+34", link: "#" },
      /* 35 */ { name: "Gadget Name 35", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+35", link: "#" },
      /* 36 */ { name: "Gadget Name 36", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+36", link: "#" },
      /* 37 */ { name: "Gadget Name 37", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+37", link: "#" },
      /* 38 */ { name: "Gadget Name 38", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+38", link: "#" },
      /* 39 */ { name: "Gadget Name 39", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+39", link: "#" },
      /* 40 */ { name: "Gadget Name 40", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+40", link: "#" },
      /* 41 */ { name: "Gadget Name 41", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+41", link: "#" },
      /* 42 */ { name: "Gadget Name 42", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+42", link: "#" },
      /* 43 */ { name: "Gadget Name 43", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+43", link: "#" },
      /* 44 */ { name: "Gadget Name 44", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+44", link: "#" },
      /* 45 */ { name: "Gadget Name 45", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+45", link: "#" },
      /* 46 */ { name: "Gadget Name 46", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+46", link: "#" },
      /* 47 */ { name: "Gadget Name 47", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+47", link: "#" },
      /* 48 */ { name: "Gadget Name 48", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+48", link: "#" },
      /* 49 */ { name: "Gadget Name 49", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+49", link: "#" },
      /* 50 */ { name: "Gadget Name 50", price: "৳ 0,000", img: "https://placehold.co/300x300?text=Product+50", link: "#" }
    ];

    const grid = document.getElementById("productGrid");
    const noResult = document.getElementById("noResult");
    const searchInput = document.getElementById("searchInput");

    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");
    const lbPrice = document.getElementById("lbPrice");
    const lbCounter = document.getElementById("lbCounter");
    const lbClose = document.getElementById("lbClose");
    const lbImgArea = document.getElementById("lbImgArea");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentImages = [];
    let currentIndex = 0;

    function getImages(item) {
      if (Array.isArray(item.img)) {
        return item.img.length > 0 ? item.img : [""];
      }
      return [item.img || ""];
    }

    function updateLightboxImage() {
      lbImg.src = currentImages[currentIndex];
      lbCounter.textContent = (currentIndex + 1) + " / " + currentImages.length;

      if (currentImages.length > 1) {
        prevBtn.style.display = "inline-block";
        nextBtn.style.display = "inline-block";
      } else {
        prevBtn.style.display = "none";
        nextBtn.style.display = "none";
      }
    }

    function openLightbox(item) {
      currentImages = getImages(item);
      currentIndex = 0;
      lbTitle.textContent = item.name;
      lbPrice.textContent = item.price;
      updateLightboxImage();
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
      updateLightboxImage();
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % currentImages.length;
      updateLightboxImage();
    }

    lbClose.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", showPrev);
    nextBtn.addEventListener("click", showNext);

    // ছবির বাইরের কালো জায়গায় ক্লিক করলে বন্ধ হবে
    lbImgArea.addEventListener("click", function (e) {
      if (e.target === lbImgArea) {
        closeLightbox();
      }
    });

    // মোবাইলে ডানে-বামে সোয়াইপ (Swipe) সাপোর্ট
    let touchStartX = 0;
    lbImgArea.addEventListener("touchstart", function (e) {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lbImgArea.addEventListener("touchend", function (e) {
      if (currentImages.length <= 1) return;
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (diff > 40) showPrev();
      else if (diff < -40) showNext();
    }, { passive: true });

    // কিবোর্ড (Esc, Left, Right) সাপোর্ট
    document.addEventListener("keydown", function (e) {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft" && currentImages.length > 1) showPrev();
      if (e.key === "ArrowRight" && currentImages.length > 1) showNext();
    });

    function renderProducts(list) {
      grid.innerHTML = "";
      if (list.length === 0) {
        noResult.style.display = "block";
        return;
      }
      noResult.style.display = "none";

      list.forEach(function (item) {
        const imgs = getImages(item);

        const box = document.createElement("div");
        box.className = "box";

        const topWrap = document.createElement("div");

        const imgWrap = document.createElement("div");
        imgWrap.className = "img-wrap";
        imgWrap.addEventListener("click", function () {
          openLightbox(item);
        });

        const img = document.createElement("img");
        img.src = imgs[0];
        img.alt = item.name;
        img.loading = "lazy";
        imgWrap.appendChild(img);

        if (imgs.length > 1) {
          const badge = document.createElement("span");
          badge.className = "multi-badge";
          badge.textContent = "📷 " + imgs.length;
          imgWrap.appendChild(badge);
        }

        const title = document.createElement("h2");
        title.textContent = item.name;

        topWrap.appendChild(imgWrap);
        topWrap.appendChild(title);

        const bottomWrap = document.createElement("div");

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = item.price;

        const btn = document.createElement("a");
        btn.className = "link-btn";
        btn.href = item.link || "#";
        btn.textContent = "Order / Link";
        if (item.link && item.link !== "#") {
          btn.target = "_blank";
          btn.rel = "noopener noreferrer";
        }

        bottomWrap.appendChild(price);
        bottomWrap.appendChild(btn);

        box.appendChild(topWrap);
        box.appendChild(bottomWrap);
        grid.appendChild(box);
      });
    }

    searchInput.addEventListener("input", function () {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = products.filter(function (item) {
        return item.name.toLowerCase().includes(query);
      });
      renderProducts(filtered);
    });

    renderProducts(products);
  </script>

</body>
</html>
